<!--
  Studiior schedule embed.

  Paste this whole block into a Webflow "Embed" element. Fill in the three
  CONFIG values below with your studio's own Supabase URL, anon (publishable)
  key, and slug — the same URL and key the member app uses; they are public by
  design. Nothing else needs changing.

  It renders your OWN timetable, branded with your OWN accent, logo and
  class-type colours (read live from Studiior, so changing your accent changes
  the embed too). Every class links to your member app's booking page for that
  class. There is no Studiior branding.
-->
<div id="studiior-schedule" data-studiior></div>
<script>
(function () {
  // ---- CONFIG -------------------------------------------------------------
  var SUPABASE_URL      = "https://YOUR-PROJECT.supabase.co";
  var SUPABASE_ANON_KEY = "YOUR-PUBLISHABLE-KEY";
  var STUDIO_SLUG       = "your-studio-slug";
  var DAYS              = 7;   // how many days ahead to show (1–14)
  // -------------------------------------------------------------------------

  var mount = document.getElementById("studiior-schedule");
  if (!mount) return;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function esc(s) { return (s == null ? "" : String(s)); }

  // Scoped styles, injected once. Everything is prefixed .sd- so it cannot
  // collide with the studio's Webflow styles. The accent is a CSS variable set
  // from the studio's own branding.
  if (!document.getElementById("sd-styles")) {
    var css = document.createElement("style");
    css.id = "sd-styles";
    css.textContent = [
      ".sd-wrap{--sd-accent:#111827;font-family:inherit;max-width:640px;margin:0 auto;color:#1a1a1a;}",
      ".sd-head{display:flex;align-items:center;gap:12px;margin:0 0 14px;}",
      ".sd-logo{height:36px;width:auto;display:block;}",
      ".sd-name{font-size:18px;font-weight:700;margin:0;}",
      ".sd-days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;}",
      ".sd-day{flex:0 0 auto;border:1px solid #e4e4e4;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;line-height:1;cursor:pointer;color:#444;white-space:nowrap;}",
      ".sd-day[aria-selected='true']{background:var(--sd-accent);border-color:var(--sd-accent);color:#fff;font-weight:600;}",
      ".sd-day .sd-dow{font-weight:600;}",
      ".sd-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}",
      ".sd-row{display:flex;align-items:center;gap:12px;border:1px solid #ececec;border-left-width:4px;border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit;background:#fff;}",
      ".sd-row:hover{border-color:#dcdcdc;}",
      ".sd-time{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;width:48px;}",
      ".sd-mid{flex:1 1 auto;min-width:0;}",
      ".sd-class{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}",
      ".sd-meta{font-size:12.5px;color:#666;margin-top:2px;display:flex;align-items:center;gap:6px;}",
      ".sd-av{width:18px;height:18px;border-radius:999px;object-fit:cover;background:#eee;display:inline-block;vertical-align:middle;}",
      ".sd-end{flex:0 0 auto;text-align:right;}",
      ".sd-spaces{font-size:13px;font-weight:600;color:var(--sd-accent);white-space:nowrap;}",
      ".sd-full{font-size:12.5px;font-weight:600;color:#8a8a8a;white-space:nowrap;}",
      ".sd-book{font-size:11.5px;color:#888;white-space:nowrap;}",
      ".sd-empty{color:#777;font-size:14px;padding:16px 2px;}",
      "@media (max-width:420px){.sd-time{width:44px;font-size:14px;}.sd-class{font-size:14px;}}"
    ].join("");
    document.head.appendChild(css);
  }

  fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/rpc/public_schedule", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
    body: JSON.stringify({ p_slug: STUDIO_SLUG, p_days: DAYS })
  })
  .then(function (r) { return r.json(); })
  .then(render)
  .catch(function () { /* stay silent — a broken widget is worse than none */ });

  function dayLabel(dateStr) {
    var d = new Date(dateStr + "T12:00:00");
    return {
      dow: d.toLocaleDateString(undefined, { weekday: "short" }),
      day: d.toLocaleDateString(undefined, { day: "numeric", month: "short" })
    };
  }

  function render(data) {
    if (!data || !data.found) { mount.textContent = ""; return; }
    var studio = data.studio || {};
    var classes = data.classes || [];

    var wrap = el("div", "sd-wrap");
    wrap.style.setProperty("--sd-accent", studio.accent_color || "#111827");

    var head = el("div", "sd-head");
    if (studio.logo_url) {
      var img = el("img", "sd-logo"); img.src = studio.logo_url; img.alt = esc(studio.name);
      head.appendChild(img);
    }
    head.appendChild(el("p", "sd-name", studio.name || "This week"));
    wrap.appendChild(head);

    // Group by local date, in order.
    var byDay = {}; var order = [];
    classes.forEach(function (c) {
      if (!byDay[c.date]) { byDay[c.date] = []; order.push(c.date); }
      byDay[c.date].push(c);
    });

    if (order.length === 0) {
      wrap.appendChild(el("div", "sd-empty", "No classes scheduled just now — check back soon."));
      mount.innerHTML = ""; mount.appendChild(wrap); return;
    }

    var days = el("div", "sd-days");
    var list = el("div", "sd-list");
    var selected = order[0];

    function paintList() {
      list.innerHTML = "";
      (byDay[selected] || []).forEach(function (c) {
        var row = el("a", "sd-row");
        row.href = c.book_url; row.target = "_blank"; row.rel = "noopener";
        row.style.borderLeftColor = c.color || "var(--sd-accent)";

        row.appendChild(el("div", "sd-time", c.time));

        var mid = el("div", "sd-mid");
        mid.appendChild(el("div", "sd-class", c.class_name));
        var meta = el("div", "sd-meta");
        if (c.instructor_avatar_url) {
          var av = el("img", "sd-av"); av.src = c.instructor_avatar_url; av.alt = ""; meta.appendChild(av);
        }
        var bits = [];
        if (c.instructor_first_name) bits.push(c.instructor_first_name);
        if (c.room) bits.push(c.room);
        meta.appendChild(el("span", null, bits.join(" · ")));
        mid.appendChild(meta);
        row.appendChild(mid);

        var end = el("div", "sd-end");
        if (c.full) {
          end.appendChild(el("div", "sd-full", "Full"));
          end.appendChild(el("div", "sd-book", "Join the waitlist"));
        } else {
          end.appendChild(el("div", "sd-spaces", c.spaces_left + (c.spaces_left === 1 ? " space" : " spaces")));
          end.appendChild(el("div", "sd-book", "Book"));
        }
        row.appendChild(end);
        list.appendChild(row);
      });
    }

    order.forEach(function (date) {
      var lab = dayLabel(date);
      var btn = el("button", "sd-day");
      btn.type = "button";
      btn.setAttribute("aria-selected", date === selected ? "true" : "false");
      var dow = el("span", "sd-dow", lab.dow + " "); btn.appendChild(dow);
      btn.appendChild(document.createTextNode(lab.day));
      btn.addEventListener("click", function () {
        selected = date;
        Array.prototype.forEach.call(days.children, function (b, i) {
          b.setAttribute("aria-selected", order[i] === selected ? "true" : "false");
        });
        paintList();
      });
      days.appendChild(btn);
    });

    wrap.appendChild(days);
    wrap.appendChild(list);
    paintList();

    mount.innerHTML = "";
    mount.appendChild(wrap);
  }
})();
</script>
